[package]
name = "quai"
version = "0.1.0"
edition = "2024"
description = "Two-column Unity-style dock for the COSMIC desktop"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
calloop = "0.14.4"
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9", version = "0.2.0" }
cosmic-text = "0.19.0"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4.34"
notify = "8.2.0"
resvg = "0.48.1"
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
tiny-skia = "0.12.0"
toml = "1.1.6"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Drawing is far too slow without optimisation, even while developing.
[profile.dev.package."*"]
opt-level = 2
